name: iPhone app (App Store)

# Builds the iPhone app for app.ceritaproject.nl (Capacitor shell in apple/) on a GitHub Mac, signs it
# with Xcode's automatic (cloud) signing and uploads it to App Store Connect, where it shows up in
# TestFlight. Secrets: APPLE_TEAM_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY_P8 (an
# App Store Connect API key with the Admin role). Without them it only makes an unsigned test build.
on:
  workflow_dispatch:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      BUNDLE_ID: com.ceritaproject.mijnapp
      VERSION: "1.0.0"
    defaults:
      run:
        shell: bash
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Make the Xcode project
        run: |
          npm install --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          ls ios/App

      - name: Icon, name and settings
        run: |
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp icon-1024.png "$f"; done
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CeritaProject" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST"

      - name: Test build (no signing secrets yet)
        if: env.KEY_P8 == '' || env.TEAM_ID == ''
        run: |
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" | tail -20
          echo "::notice::Testbouw gelukt. Zet de vier Apple-secrets in GitHub voor een echte bouw naar TestFlight."

      - name: Archive, sign and upload to App Store Connect
        if: env.KEY_P8 != '' && env.TEAM_ID != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice::Build ${{ github.run_number }} (versie $VERSION) staat in App Store Connect. Na ongeveer 15 minuten verschijnt hij in TestFlight."

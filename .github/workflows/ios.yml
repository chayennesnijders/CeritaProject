name: iPhone app (App Store)

# GitHub gives this account no Mac runners right now; codemagic.yaml runs the same apple/build.sh.
# Builds the iPhone app for app.ceritaproject.nl (Capacitor shell in apple/) on a GitHub Mac, signs it
# with Xcode's automatic (cloud) signing and uploads it to App Store Connect, where it shows up in
# TestFlight. Secrets: APPLE_TEAM_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_KEY_P8 (an
# App Store Connect API key with the Admin role). Without them it only makes an unsigned test build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build, sign and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh
